{% extends "layout.html" %}
{% block content %}
    {% for header in headers %}
        <h2>{{ header.title }}</h2>
        <p>{{ header.subheader }}</p>

        {% if header.title == "Recordings" %}
            <ul> <!-- displaying names -->
                {% for x in test %}
                    <li>{{x}}</li>
                {% endfor %}
            </ul>
        {% endif %}
    {% endfor %}
{% endblock content %}
